[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysadmin-tui"
version = "0.1.0"
description = "Aplicacion de consola interactiva para administracion de servidores Linux"
readme = "docs/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alex Rasen", email = "a.bustos@gmail.com"}]
dependencies = [
    "textual>=0.52.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-textual-snapshot>=1.0",
]

[project.scripts]
sysadmin-tui = "src.main:main"

